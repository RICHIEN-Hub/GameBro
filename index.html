<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>街頭小車手</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
/* Layout: one framed arcade screen. Canvas road underneath, HUD pills on top, menu/over/pause as stacked panels.
   Palette is lifted from the alley: tin-roof blue, plaster yellow, moss green, asphalt grey. */
:root{
  --wall:#ecd29a;
  --paper:#fff7e1;
  --paper2:#fffdf4;
  --ink:#1d2430;
  --ink2:#4b5361;
  --tin:#1d67d1;
  --tin-d:#154a96;
  --moss:#6fa352;
  --red:#d6362c;
  --asphalt:#4d535c;
  --f-ui:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-num:'Barlow Condensed','Noto Sans TC',system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--wall);
  color:var(--ink);
  font-family:var(--f-ui);
  font-size:15px;
  padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--tin);outline-offset:2px}

#app{
  position:relative;height:100%;max-width:460px;margin:0 auto;
  border-radius:20px;overflow:hidden;background:var(--asphalt);
  box-shadow:0 0 0 3px var(--ink),0 6px 0 3px rgba(29,36,48,.22);
}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(ellipse at center,rgba(214,54,44,0) 35%,rgba(214,54,44,.6) 100%)}
#flash.on{opacity:1;transition:none}

/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;padding:10px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.pill{background:rgba(255,247,225,.95);color:var(--ink);border-radius:999px;padding:4px 11px;font-weight:700;
  display:flex;align-items:center;gap:6px;box-shadow:0 2px 0 rgba(29,36,48,.4);min-height:34px}
.num{font-family:var(--f-num);font-weight:700;font-size:24px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.unit{font-size:11px;color:var(--ink2);font-weight:700}
#hearts{gap:3px;padding-inline:9px}
#hearts svg{width:19px;height:19px;display:block}
#clock.warn{background:var(--red);color:#fff}
#pauseBtn{pointer-events:auto;border:0;padding:0;width:38px;justify-content:center}
#hint{flex:1;justify-content:center;text-align:center;font-size:12px;line-height:1.35;padding:6px 10px;transition:opacity .6s}
#hint.off{opacity:0}

.pv{display:flex;align-items:center;gap:14px;background:#f3e3b4;border-radius:12px;padding:8px 14px 8px 8px}
.pvface{width:92px;height:92px;flex:none;background:var(--paper2);border-radius:50%;box-shadow:inset 0 0 0 3px var(--ink);overflow:hidden}
.pvface svg{width:100%;height:100%;display:block}
.pvtx b{font-size:22px;font-weight:900;display:block}
.pvtx span{font-size:12px;color:var(--ink2)}
.pill.hot{background:#e8590c;color:#fff}
.pill.hot .unit{color:#fff}

.hardbtn{width:100%;margin-top:10px;text-align:left;padding:11px 12px;background:var(--paper2);border:2px solid rgba(29,36,48,.16);border-radius:10px;display:flex;flex-direction:column;gap:2px}
.hardbtn b{font-size:17px;font-weight:900}
.hardbtn span{font-size:12px;color:var(--ink2);line-height:1.5}
.hardbtn[aria-pressed="true"]{border-color:#c92a20;background:#ffe9e5;box-shadow:0 3px 0 #c92a20}
.pill.wx{gap:3px;padding:4px 9px;font-size:13px}
.pill.wx svg{width:17px;height:17px;flex:none;display:block}
.chip.red{background:#c92a20}
.colr{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.act.horn{width:66px;height:66px}
.act.horn .face{inset:7px;font-size:10px;background:#f2b705;color:var(--ink)}
.act.horn .face svg{width:20px;height:20px}
.act.horn .ring .fg{stroke:#fff7e1}

/* Cover */
#cover{background:#2b2a5e;z-index:5;cursor:pointer;overflow:hidden}
#cvCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#cover .ttl{position:absolute;left:0;right:0;top:0;padding:20px 16px 0;text-align:center;pointer-events:none}
#cover h1{margin:0;font-weight:900;font-size:clamp(40px,13vw,56px);letter-spacing:.07em;line-height:1.1;color:#fff7e1;
  -webkit-text-stroke:2px #0f1a3a;paint-order:stroke fill;text-shadow:0 5px 0 #1d67d1,0 8px 0 rgba(15,26,58,.55);transform:rotate(-3deg)}
#cover .tag{display:inline-block;margin-top:14px;background:#ffd23f;color:#1d2430;font-weight:900;font-size:13px;letter-spacing:.14em;padding:4px 14px;border-radius:999px;box-shadow:0 3px 0 rgba(15,26,58,.6)}
#cover .go{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;
  background:linear-gradient(to top,rgba(10,12,28,.78),rgba(10,12,28,0))}
#cover .go .btn{flex:none;width:min(100%,280px);pointer-events:auto;animation:pulse 1.1s ease-in-out infinite}
#cover .go small{color:#fff7e1;font-size:12px;letter-spacing:.12em;opacity:.85}
@keyframes pulse{50%{transform:scale(1.045)}}
@media (prefers-reduced-motion:reduce){#cover .go .btn{animation:none}}

/* Controls and effects */
.fx{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.chip{font-weight:900;font-size:12px;letter-spacing:.06em;padding:3px 10px;border-radius:999px;color:#fff;box-shadow:0 2px 0 rgba(29,36,48,.4)}
.chip.ice{background:#2b7fc4}.chip.grn{background:#2f8f64}.chip.amb{background:#b87408}
.bottom{align-items:flex-end;gap:8px}
.act{position:relative;width:84px;height:84px;padding:0;border:0;background:none;pointer-events:auto;touch-action:none;flex:none;-webkit-touch-callout:none}
.act .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.act .ring circle{fill:none;stroke-width:5}
.act .ring .bg{stroke:rgba(29,36,48,.45)}
.act .ring .fg{stroke:#ffe27a;stroke-linecap:round}
.act .face{position:absolute;inset:9px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#fff;font-weight:900;font-size:11px;letter-spacing:.08em;box-shadow:0 0 0 3px var(--ink),0 3px 0 3px rgba(29,36,48,.35)}
.act .face svg{width:26px;height:26px;display:block}
.act.nitro .face{background:#e8590c}
.act.brake .face{background:#d6362c}
.act.down .face{filter:brightness(1.18);transform:translateY(2px)}
#flash.white{background:rgba(255,255,255,.78)}

/* Panels */
.screen{position:absolute;inset:0;overflow-y:auto;background:var(--paper);display:flex;flex-direction:column}
.screen.dim{background:rgba(29,36,48,.6);display:grid;place-items:center;padding:16px}
.card{background:var(--paper);border-radius:16px;padding:20px;width:min(100%,340px);box-shadow:0 0 0 3px var(--ink),0 6px 0 3px rgba(29,36,48,.3);display:flex;flex-direction:column;gap:14px}
.tin{
  background:repeating-linear-gradient(90deg,#2a77e0 0 8px,#1d67d1 8px 13px,#3b88ee 13px 17px);
  color:#fff;padding:22px 18px 16px;border-bottom:4px solid var(--tin-d);flex:none;
}
.tin h1{margin:0;font-weight:900;font-size:clamp(34px,11vw,46px);letter-spacing:.06em;line-height:1.1;text-shadow:0 3px 0 var(--tin-d);text-wrap:balance}
.tin p{margin:6px 0 0;font-size:13px;font-weight:700;letter-spacing:.08em;opacity:.95}
.body{padding:16px;display:flex;flex-direction:column;gap:18px;flex:1}
.lab{font-size:12px;font-weight:900;letter-spacing:.16em;color:var(--ink2);margin:0 0 8px}
#chars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.char{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 7px;background:var(--paper2);
  border:2px solid rgba(29,36,48,.16);border-radius:12px;min-width:0}
.char svg.av{width:100%;max-width:60px;height:auto;display:block}
.char .nm{display:flex;align-items:center;gap:4px;font-weight:700;font-size:13px}
.char .mini{width:9px;height:16px;flex:none}
.char[aria-pressed="true"]{border-color:var(--tin);background:#e8f1ff;box-shadow:0 3px 0 var(--tin)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{text-align:left;padding:11px 12px;background:var(--paper2);border:2px solid rgba(29,36,48,.16);border-radius:10px;display:flex;flex-direction:column;gap:2px}
.mode b{font-size:17px;font-weight:900}
.mode span{font-size:12px;color:var(--ink2)}
.mode .best{font-family:var(--f-num);font-weight:700;font-size:16px;color:var(--ink)}
.mode[aria-pressed="true"]{border-color:var(--tin);background:#e8f1ff;box-shadow:0 3px 0 var(--tin)}
.how{margin:0;padding:10px 12px;background:#f3e3b4;border-radius:10px;font-size:13px;line-height:1.6}
.how b{font-weight:900}
.foot{position:sticky;bottom:0;padding:12px 16px;background:linear-gradient(to top,var(--paper) 70%,rgba(255,247,225,0));display:flex;gap:10px;align-items:center;flex:none}
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:900;font-size:18px;letter-spacing:.12em;background:var(--tin);color:#fff;box-shadow:0 4px 0 var(--tin-d);flex:1}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tin-d)}
.btn.alt{background:var(--paper2);color:var(--ink);box-shadow:0 4px 0 rgba(29,36,48,.3);border:2px solid rgba(29,36,48,.2)}
.btn.alt:active{box-shadow:0 1px 0 rgba(29,36,48,.3)}
.snd{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border:2px solid rgba(29,36,48,.2);background:var(--paper2);border-radius:10px;padding:8px 10px;white-space:nowrap}
.snd[aria-pressed="false"]{opacity:.55}

/* Result */
.card h2{margin:0;font-size:26px;font-weight:900;letter-spacing:.06em;text-wrap:balance}
.card .sub{margin:-8px 0 0;color:var(--ink2);font-size:14px}
.big{font-family:var(--f-num);font-weight:700;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-family:var(--f-ui);font-size:14px;color:var(--ink2);margin-left:6px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--paper2);border:2px solid rgba(29,36,48,.12);border-radius:10px;padding:8px 6px;text-align:center}
.stats .num{display:block;font-size:26px}
.stats span.unit{display:block;margin-top:2px}
.btns{display:flex;flex-direction:column;gap:10px}
.rank{display:inline-block;align-self:flex-start;background:var(--moss);color:#fff;font-weight:900;border-radius:6px;padding:3px 10px;letter-spacing:.1em}
</style>

<div id="app">
  <canvas id="c" aria-label="開車遊戲畫面"></canvas>
  <div id="flash"></div>

  <div id="hud" hidden>
    <div class="row">
      <div class="pill" id="hearts" aria-label="生命"></div>
      <div class="pill" id="clock"><span class="num" id="clockT">3:00</span></div>
      <div class="pill"><span class="num" id="scoreT">0</span><span class="unit">分</span></div>
      <button class="pill" id="pauseBtn" type="button" aria-label="暫停">
        <svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><rect x="1" y="1" width="4" height="14" rx="1" fill="#1d2430"/><rect x="9" y="1" width="4" height="14" rx="1" fill="#1d2430"/></svg>
      </button>
    </div>
    <div class="row">
      <div class="pill" id="spdPill"><span class="num" id="spdT">0</span><span class="unit">km/h</span></div>
      <div class="pill wx" id="wxPill" hidden></div>
      <div class="pill"><span class="num" id="distT">0.0</span><span class="unit">km</span></div>
    </div>
    <div id="fx" class="fx"></div>
    <div style="flex:1"></div>
    <div class="row bottom">
      <button class="act nitro" id="nitroBtn" type="button" aria-label="氮氣加速，按住使用">
        <svg class="ring" viewBox="0 0 84 84" aria-hidden="true"><circle class="bg" cx="42" cy="42" r="39"/><circle class="fg" id="nitroRing" cx="42" cy="42" r="39" pathLength="100" stroke-dasharray="100" stroke-dashoffset="60"/></svg>
        <span class="face"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 5 13.5h5.5L9.5 22 19 9.5h-5.7z" fill="#fff"/></svg>氮氣</span>
      </button>
      <div class="pill" id="hint">左右滑換線　上下滑加減速</div>
      <div class="colr">
        <button class="act horn" id="hornBtn" type="button" aria-label="喇叭">
          <svg class="ring" viewBox="0 0 84 84" aria-hidden="true"><circle class="bg" cx="42" cy="42" r="39"/><circle class="fg" id="hornRing" cx="42" cy="42" r="39" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/></svg>
          <span class="face"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5v5h3.5L12 19V5L6.5 9.5z" fill="#1d2430"/><path d="M15 8.5a5 5 0 0 1 0 7M17.6 6a8.6 8.6 0 0 1 0 12" fill="none" stroke="#1d2430" stroke-width="2" stroke-linecap="round"/></svg>喇叭</span>
        </button>
        <button class="act brake" id="brakeBtn" type="button" aria-label="手煞車，按住使用">
        <svg class="ring" viewBox="0 0 84 84" aria-hidden="true"><circle class="bg" cx="42" cy="42" r="39"/></svg>
        <span class="face"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="#fff" stroke-width="2.2"/><text x="12" y="16.4" text-anchor="middle" font-size="12" font-weight="900" fill="#fff" font-family="sans-serif">P</text></svg>手煞</span>
      </button>
      </div>
    </div>
  </div>

  <section class="screen" id="menu" hidden>
    <div class="tin">
      <h1>街頭小車手</h1>
      <p>七位車手・三線道・小心衝出來的行人</p>
    </div>
    <div class="body">
      <div>
        <div class="pv"><div class="pvface" id="pvFace"></div><div class="pvtx"><b id="pvName">布丁</b><span>敞篷跑車車手</span></div></div>
        <p class="lab" style="margin-top:14px">選擇車手</p>
        <div id="chars" role="group" aria-label="選擇車手"></div>
      </div>
      <div>
        <p class="lab">遊戲模式</p>
        <div class="modes" role="group" aria-label="遊戲模式">
          <button class="mode" type="button" data-mode="timed" aria-pressed="true"><b>三分鐘</b><span>倒數結束比分數</span><span class="best" id="bestTimed">最高 0</span></button>
          <button class="mode" type="button" data-mode="endless" aria-pressed="false"><b>無限時</b><span>開到沒命為止</span><span class="best" id="bestEndless">最高 0</span></button>
        </div>
        <button class="hardbtn" id="hardBtn" type="button" aria-pressed="false"><b>困難模式</b><span>再加上日夜與天氣變化、天氣預報、紅綠燈、十字路口和橫向來車</span></button>
      </div>
      <p class="how"><b>操作</b>　左右滑換線，上下滑加減速。左下氮氣（最高 250 km/h）與右下手煞車都是按住使用，喇叭輕點，可以趕走前車，但也可能惹毛對方。撞車或撞到行人、動物扣一顆愛心。路邊有測速照相，超過限速會扣分；路上可撿愛心、時鐘、冰晶、氮氣罐和護盾。</p>
    </div>
    <div class="foot">
      <button class="snd" id="musicBtn" type="button" aria-pressed="true">音樂 開</button>
      <button class="snd" id="sndBtn" type="button" aria-pressed="true">音效 開</button>
      <button class="btn" id="startBtn" type="button">出發</button>
    </div>
  </section>

  <section class="screen" id="cover" aria-label="封面">
    <canvas id="cvCanvas" aria-hidden="true"></canvas>
    <div class="ttl"><h1>街頭小車手</h1><span class="tag">七位車手 衝鋒陷陣</span></div>
    <div class="go"><button class="btn" id="coverBtn" type="button">開始遊戲</button><small>輕觸畫面任何地方</small></div>
  </section>

  <section class="screen dim" id="pause" hidden>
    <div class="card">
      <h2>暫停中</h2>
      <div class="btns">
        <button class="btn" id="resumeBtn" type="button">繼續</button>
        <button class="btn alt" id="quitBtn" type="button">回選單</button>
      </div>
    </div>
  </section>

  <section class="screen dim" id="over" hidden>
    <div class="card">
      <span class="rank" id="rankT">公路好手</span>
      <h2 id="overH">時間到！</h2>
      <p class="sub" id="overSub"></p>
      <div class="big"><span id="finalScore">0</span><small>分</small></div>
      <div class="stats">
        <div><span class="num" id="stDist">0.0</span><span class="unit">公里</span></div>
        <div><span class="num" id="stPass">0</span><span class="unit">次超車</span></div>
        <div><span class="num" id="stHit">0</span><span class="unit">次撞擊</span></div>
      </div>
      <div class="btns">
        <button class="btn" id="againBtn" type="button">再開一次</button>
        <button class="btn alt" id="menuBtn" type="button">回選單</button>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var cv=$('#c'), ctx=cv.getContext('2d');
var W=400, SW=50, LW=100, MINS=200, MAXS=420, TIMED=180;
var H=720, scale=1, DPR=1;
var reduce=false;
try{reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
function laneX(i){return SW+LW*i+LW/2}
function rand(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

/* ---------- characters ---------- */
// Heads are drawn from the photo: hair shape, glasses, face length and shirt per person.
var CHARS=[
 {name:'布丁',  shirt:'#9aa3ad', car:'#8f9ba8', stripe:'#e4e8ec', skin:'#f1c9a1', R:19.5, Ry:20.5, hair:'sweepL',  glass:{t:'rect',col:'#27458f'},            def:'smile',   sig:'shy',     detail:'polo'},
 {name:'小以以',shirt:'#233a6b', car:'#25407a', stripe:'#f0c24b', skin:'#f0c8a0', R:17.5, Ry:23,   hair:'bowlpart',glass:{t:'round',col:'#c3a35f',r:6.4},   def:'deadpan', sig:'deadpan', detail:'emblem'},
 {name:'肯尼',  shirt:'#1b1b20', car:'#2a2c33', stripe:'#ffffff', skin:'#e9bf95', R:18.5, Ry:21.5, hair:'bowl',    glass:{t:'rect',col:'#14141a'},            def:'peace',   sig:'peace',   detail:'swoosh'},
 {name:'荳荳',  shirt:'#f6f5f1', car:'#e9e7df', stripe:'#6fb1e8', skin:'#ebc29a', R:17,   Ry:23.5, hair:'curtain', glass:null,                                def:'smile',   sig:'smirk',   detail:'pocket'},
 {name:'達達',  shirt:'#f6f5f1', car:'#d9483b', stripe:'#ffffff', skin:'#f0c8a0', R:18,   Ry:22,   hair:'bowl',    glass:{t:'round',col:'#8a7a64',r:5.8},   def:'munch',   sig:'munch',   detail:''},
 {name:'瀚瀚',  shirt:'#17171c', car:'#f0a92b', stripe:'#1d2430', skin:'#e2b184', R:23,   Ry:21,   hair:'spiky',   glass:null,                                def:'laugh',   sig:'laugh',   detail:'dragon'},
 {name:'小右',  shirt:'#3f78d6', car:'#3e7fe0', stripe:'#ffffff', skin:'#e8bd92', R:18,   Ry:22.5, hair:'sweepR',  glass:{t:'rect',col:'#14141a',thick:true}, def:'stare',   sig:'stare',   detail:'necklace'}
];
var HAIR='#18171c', OUTL='#0b0a0e';
var EXPR={
  neutral:{eye:'open',mouth:'flat'},
  smile:{eye:'open',mouth:'smile'},
  grin:{eye:'happy',mouth:'grin'},
  laugh:{eye:'happy',mouth:'laugh',blush:1},
  wink:{eye:'wink',mouth:'smile'},
  tongue:{eye:'open',mouth:'tongue'},
  surprise:{eye:'wide',mouth:'o',brow:-2.6,sweat:1},

      var A=window.AudioContext||window.webkitAudioContext;

        mg=ac.createGain(); mg.gain.value=0; mg.connect(ac.destination);

        var len=ac.sampleRate*2, b=ac.createBuffer(1,len,ac.sampleRate), d=b.getChannelData(0);

}

}

    if(s===0||s===8) mtone(midi(ch[0]),t,.8,'sine',.17,.02);

function honk(){
  if(S.state!=='play'||S.paused||S.dead||S.hornCd>0) return;
  S.hornCd=1.6; S.hornFx=.55; S.bubble='叭！叭！'; S.bubbleT=.7;
  hornSound();
  var tg=[],i,v;
  for(i=0;i<vehicles.length;i++){ v=vehicles[i]; var dy=P.y-v.y; if(dy>50&&dy<360&&Math.abs(v.x-P.x)<62&&!v.passed) tg.push(v); }
  var r=Math.random(), res;
  if(tg.length) res=r<.55?'flee':(r<.82?'angry':'scare'); else res=(r<.3)?'scare':'none';
  var cx=P.x, cy=P.y-82;
  if(res==='flee'){
    tg.forEach(function(t){
      var cand=[t.lane-1,t.lane+1].filter(function(l){return l>=0&&l<=2}).sort(function(){return Math.random()-.5}), moved=false;
      for(var k=0;k<cand.length&&!moved;k++){
        var l=cand[k], ok=true;
        for(var j=0;j<vehicles.length;j++){ var o=vehicles[j]; if(o!==t&&o.lane===l&&Math.abs(o.y-t.y)<(o.h+t.h)/2+60){ok=false;break;} }

      }
      t.base=Math.min(210,t.base+(moved?20:50));
      if(t.look) forceLook(t.look,'wink',1.2);
    });

function crossSpawn(ix,dir,runner,atX){

function spawnIx(){

function updateIx(dt,sp,counting){
  for(var qi=0;qi<ixs.length;qi++){
    var ix=ixs[qi]; ix.y+=sp*dt;

    if(S.freeze<=0) ix.t+=dt;
    var m=ix.t%cyc; ix.state=m<ix.G?'green':(m<ix.G+ix.Y?'yellow':'red');
    if(S.freeze<=0){
      if(ix.state==='red'&&m>ix.G+ix.Y+.4){
        ix.sp1-=dt; ix.sp2-=dt;

        if(ix.sp2<=0){ix.sp2=rand(1,2);crossSpawn(ix,-1,false);}
      }
      if(ix.runner&&!ix.runDone&&ix.state==='green'&&m>ix.G*.5){ix.runDone=true;crossSpawn(ix,Math.random()<.5?1:-1,true);}

function drawIntersections(ts){

/* ---------- update ---------- */
function update(dt){
  if(S.state==='over') return;
  var counting=S.state==='count';
  if(counting){
    S.count-=dt;
    var n=Math.ceil(S.count);
    if(n!==S.lastCount){S.lastCount=n; if(n>0) beep(440,0.12,'square',0.05); }
    if(S.count<=0){S.state='play'; beep(880,0.25,'square',0.06);}
    S.speed+=(150-S.speed)*Math.min(1,dt*2);
  }else{
    S.t+=dt;
    var brk=S.braking&&!S.dead, nOn=false;
    if(S.nitroOn&&!brk&&!S.dead&&S.nitro>0){nOn=true; S.nitro=Math.max(0,S.nitro-28*dt);}
    else if(!S.dead){S.nitro=Math.min(100,S.nitro+3*dt);}
    S.boost=nOn; if(nOn!==S.prevBoost){ if(nOn) forceLook(P.look,'yell',1.2); setMusic(nOn?'nitro':'chill'); } S.prevBoost=nOn;
    if(brk) S.speed+=(70-S.speed)*Math.min(1,dt*(4.5-2*S.rainI));
    else if(nOn) S.speed+=(695-S.speed)*Math.min(1,dt*5);
    else S.speed+=(S.target-S.speed)*Math.min(1,dt*2.2);
  }
  var d=Math.min(1.4,S.t/TIMED), sp=S.speed;
  S.scroll+=sp*dt;
  S.tod=(S.tod+dt/90)%1;
  if(S.hard){ stepWeather(dt); updateRain(dt); }
  if(S.inv>0) S.inv-=dt;
  if(S.shake>0) S.shake-=dt;
  if(S.bubbleT>0) S.bubbleT-=dt;
  P.x+=(laneX(P.lane)-P.x)*Math.min(1,dt*(11-5*S.rainI));
  stepLook(P.look,dt,store.sel);

  if(!counting){
    S.dist+=sp*dt;
    if(!S.dead) S.score+=sp*dt*0.01*(S.boost?1.5:1);
    if(S.freeze>0) S.freeze-=dt;
    if(S.shield>0) S.shield-=dt;
    if(S.hornCd>0) S.hornCd-=dt;
    if(S.hornFx>0) S.hornFx-=dt;
    var mark=Math.floor(S.dist/10000);
    if(mark>S.lifeMark){S.lifeMark=mark; if(S.lives<3&&!S.dead){S.lives++; renderHearts(); addFloat('補給 ♥+1',P.x,P.y-60,'#ffb3ab'); beep(740,0.15,'triangle',0.06,1100);}}
    if(S.hintT<7) S.hintT+=dt; else $('#hint').classList.add('off');

    // spawn traffic
    if(S.freeze<=0){S.vAcc+=sp*dt; if(S.vAcc>=S.vGap){S.vAcc=0; S.vGap=(340-d*140)*rand(.75,1.5); trySpawnVehicle(null);}}
    // spawn peds
    S.pTimer-=dt;
    if(S.pTimer<=0){S.pTimer=Math.max(1.1,(3.4-d*1.8))*rand(.8,1.3); spawnPed(d);}
    // scenery
    S.dAcc+=sp*dt; if(S.dAcc>=rand(110,190)){S.dAcc=0; addDeco(-40);}
    S.zAcc+=sp*dt; if(S.zAcc>=2600){S.zAcc=0; zebras.push({y:-40});}
    S.camAcc+=sp*dt; if(S.camAcc>=S.camGap){S.camAcc=0; S.camGap=rand(2200,4200); spawnCam();}
    S.pkTimer-=dt; if(S.pkTimer<=0){S.pkTimer=rand(5,10); spawnPick();}
    S.rcTimer-=dt; if(S.rcTimer<=0){S.rcTimer=rand(7,12); if(S.freeze<=0) spawnRacer();}
    if(S.hard){ S.ixAcc+=sp*dt; if(S.ixAcc>=S.ixGap){S.ixAcc=0; S.ixGap=rand(2000,3400); spawnIx();} }
    if(S.mode==='timed'&&S.t>=limitT()&&!S.dead){endGame('time'); return;}
  }else{
    S.dAcc+=sp*dt; if(S.dAcc>=150){S.dAcc=0; addDeco(-40);}
  }

  var i,j,v,p;
  for(i=0;i<deco.length;i++) deco[i].y+=sp*dt;
  deco=deco.filter(function(q){return q.y<H+60});
  for(i=0;i<zebras.length;i++) zebras[i].y+=sp*dt;
  zebras=zebras.filter(function(q){return q.y<H+60});

  // vehicles
  for(i=0;i<vehicles.length;i++){
    v=vehicles[i];
    var lead=null;
    for(j=0;j<vehicles.length;j++){ var o=vehicles[j]; if(o!==v&&o.lane===v.lane&&o.y<v.y&&(!lead||o.y>lead.y)) lead=o; }
    var targ=v.base;
    if(lead){ var gap=(v.y-v.h/2)-(lead.y+lead.h/2); if(gap<45) targ=Math.min(targ,lead.speed); if(gap<8) v.speed=Math.min(v.speed,lead.speed); }
    if(S.hard){ for(var qx=0;qx<ixs.length;qx++){ var xx=ixs[qx]; if(xx.state!=='green'){ var gp=(v.y-v.h/2)-(xx.y+xx.h/2+44); if(gp>-6&&gp<90){targ=0;break;} } } }
    if(v.brakeT>0){v.brakeT-=dt; targ=Math.min(targ,v.base*0.3);}
    v.speed+=clamp(targ-v.speed,-320*dt,130*dt);
    v.x+=(laneX(v.lane)+v.off-v.x)*Math.min(1,dt*5);
    var rel=sp-v.speed; if(S.freeze>0) rel=0; else if(v.passed&&rel<0) rel=0;
    v.y+=rel*dt;
    if(v.look) stepLook(v.look,dt,v.ch);
    if(!v.passed&&v.y-v.h/2>P.y+P.h/2){
      v.passed=true;
      if(!S.dead&&!counting){
        var near=Math.abs(v.x-P.x)<70;
        var pts=near?15:5; S.score+=pts; S.passes++;
        addFloat(near?'擦身超車 +15':'超車 +5',P.x,P.y-40,near?'#ffe27a':'#ffffff');
        beep(near?980:700,0.07,'square',0.035);
      }
    }
  }
  vehicles=vehicles.filter(function(q){return q.y<H+220&&q.y>-600});

  // peds
  for(i=0;i<peds.length;i++){
    p=peds[i]; p.y+=sp*dt;
    if(p.state==='wait'){ p.wait-=dt; if(p.wait<=0){p.state='run'; p.crossed=true;} }
    else if(p.state==='run'){
      p.x+=p.dir*p.v*dt;
      if((p.dir>0&&p.x>=W-SW/2)||(p.dir<0&&p.x<=SW/2)){p.x=p.dir>0?W-SW/2:SW/2; p.state='done';}
    }
    if(p.crossed&&!p.counted&&p.y>P.y+50){
      p.counted=true;
      if(!S.dead&&!counting){S.score+=8; addFloat('有驚無險 +8',P.x,P.y-40,'#bff0cf');}
    }
  }
  peds=peds.filter(function(q){return q.y<H+60});

  // speed cameras
  for(i=0;i<cams.length;i++){
    var cm=cams[i]; cm.y+=sp*dt; if(cm.flash>0) cm.flash-=dt;
    if(!cm.done&&cm.y>=P.y&&!S.dead&&!counting){
      cm.done=true; cm.flash=.4;
      var kmh=S.speed*0.36;
      if(kmh>cm.limit+1){S.score=Math.max(0,S.score-40); addFloat('超速罰單 -40',P.x,P.y-62,'#ff9a90'); whiteFlash(); beep(300,0.25,'sawtooth',0.06,120); forceLook(P.look,'surprise',1.1);}
      else{S.score+=15; addFloat('測速合格 +15',P.x,P.y-62,'#bff0cf'); beep(900,0.08,'triangle',0.05); forceLook(P.look,'smirk',1.0);}
    }
  }
  cams=cams.filter(function(q){return q.y<H+60});
  updateIx(dt,sp,counting);
  // pickups
  for(i=0;i<picks.length;i++){
    var pk=picks[i]; pk.y+=sp*dt;
    if(!counting&&!S.dead&&!pk.taken&&Math.abs(pk.x-P.x)<26&&Math.abs(pk.y-P.y)<P.h/2+14){pk.taken=true; takePick(pk);}
  }
  picks=picks.filter(function(q){return !q.taken&&q.y<H+40});

  // collisions
  if(!counting&&!S.dead&&S.inv<=0&&S.shield<=0){
    for(i=0;i<vehicles.length;i++){
      v=vehicles[i];
      if(Math.abs(v.x-P.x)<(v.w+P.w)/2-3&&Math.abs(v.y-P.y)<(v.h+P.h)/2-4){hurt('car');break;}
    }
    if(S.inv<=0&&!S.dead){
      for(i=0;i<peds.length;i++){
        p=peds[i];
        if(p.state!=='run') continue;
        if(Math.abs(p.x-P.x)<P.w/2+p.r-2&&Math.abs(p.y-P.y)<P.h/2+p.r-2){hurt('ped');break;}
      }
    }
  }
  if(!counting&&!S.dead&&S.inv<=0&&S.shield<=0){
    for(i=0;i<ixs.length;i++){
      for(j=0;j<ixs[i].cars.length;j++){
        var cc=ixs[i].cars[j];
        if(Math.abs(cc.x-P.x)<(cc.h+P.w)/2-3&&Math.abs(ixs[i].y+cc.off-P.y)<(cc.w+P.h)/2-4){hurt('car');i=ixs.length;break;}
      }
    }
  }
  if(S.dead){S.endT-=dt; if(S.endT<=0) endGame('crash');}

  for(i=0;i<floats.length;i++){floats[i].life-=dt; floats[i].y-=26*dt;}
  floats=floats.filter(function(f){return f.life>0});
  updateHUD();
}

/* ---------- HUD ---------- */
var lastHud={};
function setT(id,txt){ if(lastHud[id]!==txt){lastHud[id]=txt; $('#'+id).textContent=txt;} }
function updateHUD(){
  var c=S.mode==='timed'?Math.max(0,limitT()-S.t):S.t;
  var txt=Math.floor(c/60)+':'+('0'+Math.floor(c%60)).slice(-2);
  setT('clockT',txt);
  var warn=S.mode==='timed'&&limitT()-S.t<=15&&S.state==='play';
  $('#clock').classList.toggle('warn',warn);
  setT('scoreT',String(Math.floor(S.score)));
  setT('spdT',String(Math.round(S.speed*0.36)));
  setT('distT',(S.dist/10000).toFixed(1));
  $('#spdPill').classList.toggle('hot',!!S.boost);
  updateWxPill();
  var hp=S.hornCd>0?Math.round((1-S.hornCd/1.6)*100):100;
  if(lastHud.hp!==hp){lastHud.hp=hp; $('#hornRing').setAttribute('stroke-dashoffset',String(100-hp));}
  var nr=Math.round(S.nitro);
  if(lastHud.nr!==nr){lastHud.nr=nr; $('#nitroRing').setAttribute('stroke-dashoffset',String(100-nr));}
  var items=[],cam=null,i;
  if(S.freeze>0) items.push('ice|車流凍結 '+Math.ceil(S.freeze)+'s');
  if(S.shield>0) items.push('grn|護盾 '+Math.ceil(S.shield)+'s');
  for(i=0;i<cams.length;i++){ if(!cams[i].done&&cams[i].y>-30&&(!cam||cams[i].y>cam.y)) cam=cams[i]; }
  if(cam) items.push('amb|前方測速 '+cam.limit);
  if(S.hard){
    var nix=null;
    for(i=0;i<ixs.length;i++){ if(ixs[i].y>-100&&!ixs[i].checked&&(!nix||ixs[i].y>nix.y)) nix=ixs[i]; }
    if(nix) items.push((nix.state==='red'?'red|紅燈 ':(nix.state==='yellow'?'amb|黃燈 ':'grn|綠燈 '))+'前方路口');
  }
  var key=items.join('#');
  if(lastHud.fx!==key){
    lastHud.fx=key;
    $('#fx').innerHTML=items.map(function(t){var q=t.split('|');return '<span class="chip '+q[0]+'">'+q[1]+'</span>';}).join('');
  }
}

}

  var n=clamp(P.lane+dir,0,2);
  if(n!==P.lane){P.lane=n; beep(520,0.05,'square',0.03);}
}
function throttle(dir){
  if(S.state==='menu'||S.state==='over'||S.paused||S.dead) return;

  if(Math.abs(dx)>=TH&&Math.abs(dx)>Math.abs(dy)){steer(dx>0?1:-1);sx=e.clientX;sy=e.clientY;}
  else if(Math.abs(dy)>=TH&&Math.abs(dy)>Math.abs(dx)){throttle(dy<0?1:-1);sx=e.clientX;sy=e.clientY;}

  var br=W*.78, bp=toScr(0,-190);

  g.fillStyle='rgba(255,214,102,.4)'; g.beginPath();
  for(i=0;i<22;i++){ var a2=i/22*Math.PI*2, rr=(i%2?br*.62:br*(.9+.1*Math.sin(t*3+i))); g.lineTo(Math.cos(a2)*rr,Math.sin(a2)*rr); }
  g.closePath(); g.fill(); g.restore();
  g.save(); g.translate(p0x,p0y); g.rotate(rot); g.scale(k,k); g.translate(0,120);
  cvWing();
  // two chains: each rider grips the wing with one hand and the next rider with the other
  var up=-Math.PI/2, S2=64, wob=Math.sin(t*6)*3;
  var chains=[{sg:-1,a:1,b:4},{sg:1,a:3,b:6}];
  for(var ci=0;ci<2;ci++){
    var C=chains[ci], sg=C.sg, ax=sg*66, ay=-312+Math.sin(t*3+ci*2)*5, bx=sg*122, by=-362+Math.sin(t*3.4+ci*2)*5;
    var mx=(ax+bx)/2+sg*4, my=(ay+by)/2-2;
    // far rider first: free hand waves, other hand reaches the first rider
    g2.save(); g2.translate(bx,by); cvPerson(C.b,up+sg*.38,S2*.94,[[mx-bx,my-by],[sg*40,-30+wob]],.4,t); g2.restore();
    // near rider: one hand on the wing, one hand on the far rider
    g2.save(); g2.translate(ax,ay); cvPerson(C.a,up-sg*.22,S2,[[mx-ax,my-ay],[sg*60-ax,-250-ay]],.4,t); g2.restore();
  }
  // seated crew: driver in front, two behind with room between heads
  g2.save(); g2.translate(0,-154); cvPerson(0,Math.PI/2,80,[[-52,-10+wob],[52,-10-wob]],-1,t); g2.restore();
  g2.save(); g2.translate(-110,-172); cvPerson(2,Math.PI/2,76,[],-1,t); g2.restore();
  g2.save(); g2.translate(110,-172); cvPerson(5,Math.PI/2,78,[[54,-8+wob]],-1,t); g2.restore();
  cvCarFront(t);
  cvGlass();
  g.restore();
  // sparks beside the wheels
  if(!reduce){ for(i=0;i<14;i++){ var sp=((t*2.2+i*.31)%1), wp=toScr(i%2?144:-144,-2); g.fillStyle='rgba(255,'+(190+(i*13%60))+',90,'+(1-sp)+')'; g.fillRect(wp[0]+(i%2?1:-1)*sp*34-2,wp[1]+sp*14,2.6,2.6+sp*5); } }
  // edge vignette
  var vg=g.createRadialGradient(vx,H*.5,W*.4,vx,H*.5,H*.75); vg.addColorStop(0,'rgba(10,12,28,0)'); vg.addColorStop(1,'rgba(10,12,28,.5)');
  g.fillStyle=vg; g.fillRect(0,0,W,H);
}
function cvFrame(ts){
  if(!cvOn) return;
  var dt=Math.min(.05,(ts-cvLast)/1000||0); cvLast=ts; cvT+=dt;
  if(!cvr.width) cvResize();
  if(cvr.width) cvDraw(ts);
  requestAnimationFrame(cvFrame);
}
function hideCover(){
  if(!cvOn) return;
  cvOn=false; $('#cover').hidden=true; $('#menu').hidden=false; refreshMenu(); ensureAudio();
}
$('#cover').addEventListener('click',hideCover);
$('#coverBtn').addEventListener('click',function(e){e.stopPropagation();hideCover();});
window.addEventListener('keydown',function(e){ if(cvOn&&(e.key==='Enter'||e.key===' ')){hideCover();e.preventDefault();} });
window.addEventListener('resize',function(){ if(cvOn) cvResize(); });
cvResize(); requestAnimationFrame(function(ts){cvLast=ts;cvFrame(ts);});

window.addEventListener('resize',resize);
resize();
requestAnimationFrame(function(ts){last=ts;frame(ts);});
})();
</script>
